aid: dronamics
name: Dronamics
description: >-
  Dronamics is a European deep-tech company that designs, builds, and operates
  autonomous long-range cargo drones for middle-mile logistics. Its flagship
  aircraft, The Black Swan, is a remotely piloted UAV that carries up to 350 kg
  (770 lb) of cargo over distances up to 2,500 km (1,550 mi), enabling same-day,
  cross-border, point-to-point deliveries that are faster, cheaper, and lower in
  CO2 emissions than traditional air freight. Founded in 2014 in Sofia, Bulgaria
  by brothers Svilen and Konstantin Rangelov and operating as Dronamics Group
  Limited, the company is building the world's first cargo drone airline,
  operating a proprietary drone fleet from a network of low-cost droneports. The
  public dronamics.com marketing site is built on Wix and exposes a Wix Site MCP
  endpoint for agentic access; Dronamics does not publish a developer-facing
  logistics API, OpenAPI, or SDKs at this time.
